name: Full Stack CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push
        run: |
          docker build -t vorasakshii/frontend:latest ./frontend
          docker build -t vorasakshii/backend:latest ./backend
          docker push vorasakshii/frontend:latest
          docker push vorasakshii/backend:latest